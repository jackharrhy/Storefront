name: Publish Docker images
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy: &image-strategy
      fail-fast: false
      matrix:
        include:
          - project: storefront-frontend
            path: apps/frontend
            base_path: /
            suffix: ""
          - project: storefront-frontend
            path: apps/frontend
            base_path: /storefront/
            suffix: "-storefront"
          - project: storefront-discord
            path: apps/discord
            base_path: /
            suffix: ""
    steps: &image-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main') }}
          build-args: BASE_PATH=${{ matrix.base_path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  validate:
    if: ${{ !(github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy: *image-strategy
    steps: *image-steps
