name: Storefront
version: ${project.version}
main: com.jackharrhy.storefront.Storefront
api-version: '26.2'
prefix: storefront
authors: [cheesemany]
description: whatcha buying whatcha selling
website: https://github.com/jackharrhy/Storefront/
commands:
  storefrontforceupdate:
    aliases: [forceupdate]
    permission: storefront.admin
    description: Queue a refresh of tracked chests in loaded chunks
    usage: /forceupdate
  storefrontrefreshstatus:
    description: Show the most recent inventory refresh measurements
    permission: storefront.admin
permissions:
  storefront.admin:
    default: op
