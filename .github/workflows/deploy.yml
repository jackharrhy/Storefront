name: Publish Docker images
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: storefront-frontend
            path: apps/frontend
            base_path: /
            suffix: ''
          - project: storefront-frontend
            path: apps/frontend
            base_path: /storefront/
            suffix: '-storefront'
          - project: storefront-discord
            path: apps/discord
            base_path: /
            suffix: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main') }}
          build-args: BASE_PATH=${{ matrix.base_path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
