name: Build and test
on:
  push:
  pull_request:
  release:
    types: [published]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'release' && github.run_id || 'checks' }}
  # Release runs have unique groups; only superseded validation runs cancel.
  cancel-in-progress: true
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26"
          cache: ${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') && 'maven' || '' }}
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storefront-plugin
          path: target/storefront-*.jar
          if-no-files-found: error
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
      - run: ./fabric/gradlew -p fabric build smokeJar
      - name: Isolated Fabric lifecycle and restart test
        shell: bash
        run: |
          curl -fL --retry 2 'https://meta.fabricmc.net/v2/versions/loader/26.3/0.20.1/1.1.2/server/jar' -o "$RUNNER_TEMP/fabric-launch.jar"
          curl -fL --retry 2 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.165.0+26.3/fabric-api-0.165.0+26.3.jar' -o "$RUNNER_TEMP/fabric-api.jar"
          curl -fL --retry 2 'https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar' -o "$RUNNER_TEMP/minecraft.jar"
          printf '%s  %s\n' '18442e2ad466d6ef41c37dbb4cb68495e6ca6658b1f1ee9be76143d155ef2c88' "$RUNNER_TEMP/fabric-api.jar" | sha256sum -c -
          printf '%s  %s\n' '33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c' "$RUNNER_TEMP/minecraft.jar" | sha1sum -c -
          python dev/fabric-smoke.py --workspace "$RUNNER_TEMP" --launcher "$RUNNER_TEMP/fabric-launch.jar" --fabric-api "$RUNNER_TEMP/fabric-api.jar" --minecraft "$RUNNER_TEMP/minecraft.jar" --accept-eula
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: storefront-fabric-smoke-logs
          path: |
            ${{ runner.temp }}/storefront-smoke-*/lifecycle.log
            ${{ runner.temp }}/storefront-smoke-*/restart.log
            ${{ runner.temp }}/storefront-smoke-*/result.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storefront-fabric
          path: |
            fabric/build/libs/storefront-fabric-*.jar
            !fabric/build/libs/*-thin.jar
            !fabric/build/libs/*-smoke.jar
          if-no-files-found: error
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  release:
    if: github.event_name == 'release' && github.event.release.target_commitish == 'main'
    needs: [plugin, fabric, javascript]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storefront-plugin
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storefront-fabric
          path: release
      - name: Attach server JARs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/*.jar --clobber
