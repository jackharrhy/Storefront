name: Publish Docker images
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: storefront-frontend
            path: apps/frontend
            base_path: /
            suffix: ''
          - project: storefront-frontend
            path: apps/frontend
            base_path: /storefront/
            suffix: '-storefront'
          - project: storefront-discord
            path: apps/discord
            base_path: /
            suffix: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          pull: true
          no-cache: true
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.target_commitish == 'main') }}
          build-args: BASE_PATH=${{ matrix.base_path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: github.ref == 'refs/heads/main' && matrix.project == 'storefront-discord'
        name: Verify image Node version and TLS distrust
        run: |
          docker run --rm -i --entrypoint node ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}@${{ steps.image.outputs.digest }} - <<'NODE'
          const assert = require('node:assert/strict');
          assert.equal(process.versions.node, '24.22.1');
          (async () => {
            const good = await fetch('https://nodejs.org', { signal: AbortSignal.timeout(20000) });
            assert.ok(good.ok);
            console.log('PASS normal HTTPS', good.status, process.version);
            for (const host of ['dv-g3b-emudhra', 'dv-g3b-aaa-emudhra']) {
              const url = `https://${host}.we-have-a-problem.com/`;
              await assert.rejects(fetch(url, { signal: AbortSignal.timeout(20000) }), (error) => {
                const code = error.cause?.code;
                console.log('TLS rejection', url, code);
                return ['CERT_HAS_EXPIRED', 'UNABLE_TO_GET_ISSUER_CERT_LOCALLY', 'UNABLE_TO_VERIFY_LEAF_SIGNATURE', 'CERT_REVOKED', 'CERT_SIGNATURE_FAILURE'].includes(code);
              });
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - if: github.ref == 'refs/heads/main' && matrix.suffix == '-storefront'
        name: Verify nginx image TLS trust and subpath assets
        run: |
          docker run --rm --entrypoint sh ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}@${{ steps.image.outputs.digest }} -ec '
            curl --fail --silent --show-error --max-time 20 https://nodejs.org/ -o /dev/null
            for host in dv-g3b-emudhra dv-g3b-aaa-emudhra; do
              code=0
              curl --silent --show-error --max-time 20 "https://$host.we-have-a-problem.com/" -o /dev/null || code=$?
              test "$code" -eq 60
            done
            grep -q "/storefront/assets/" /usr/share/nginx/html/index.html
          '
